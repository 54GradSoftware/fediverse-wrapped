name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26 stays permanently: it removed --experimental-transform-types, never rely on it.
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx biome ci .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t fediverse-wrapped:ci .
      - name: Boot the image and wait for health
        run: |
          docker run -d --name wrapped \
            -e ORIGIN=https://wrapped.example.test \
            -e ACTOR_SALT=ci-salt-not-a-real-secret \
            -p 8000:8000 fediverse-wrapped:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo " healthy"; exit 0; fi
            sleep 2
          done
          docker logs wrapped
          exit 1
