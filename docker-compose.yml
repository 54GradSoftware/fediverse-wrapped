# Plain Compose, no Coolify magic variables. Coolify routes its domain to the exposed
# port 8000 through its own domain and port fields. Both bots share this one container.
services:
  wrapped:
    build: .
    restart: unless-stopped
    # Not `ports:`. Nothing is published on the host; the proxy reaches the container
    # directly. `expose` is what Coolify reads to accept 8000 in its port field.
    expose:
      - "8000"
    # No drain on shutdown; boot recovery re-queues interrupted jobs.
    stop_grace_period: 20s
    # Bounds the worst case of an enormous remote document.
    mem_limit: 768m
    environment:
      # IMMUTABLE after the first federation. See the warning box in README.md.
      # Typed by hand, never derived from a generated domain. Deploy fails if unset.
      - ORIGIN=${ORIGIN:?set ORIGIN, e.g. https://wrapped.fedw.eu}
      - BOT_DE_HANDLE=${BOT_DE_HANDLE:-fediwrapped_de}
      - BOT_EN_HANDLE=${BOT_EN_HANDLE:-fediwrapped_en}
      - DATA_DIR=/data
      # Secret, set once: openssl rand -hex 16. Changing it resets the daily limits.
      - ACTOR_SALT=${ACTOR_SALT:?set ACTOR_SALT to a random secret}
      - BOT_DE_TIMEZONE=${BOT_DE_TIMEZONE:-Europe/Berlin}
      - BOT_EN_TIMEZONE=${BOT_EN_TIMEZONE:-UTC}
      - RATE_LIMIT_TZ=${RATE_LIMIT_TZ:-Europe/Berlin}
      - WORKERS=${WORKERS:-2}
      - INBOX_CONCURRENCY=${INBOX_CONCURRENCY:-2}
      - DELIVERY_CONCURRENCY=${DELIVERY_CONCURRENCY:-8}
      - IMAGE_RETENTION_DAYS=${IMAGE_RETENTION_DAYS:-180}
      - JOB_RETENTION_DAYS=${JOB_RETENTION_DAYS:-30}
      - LEDGER_RETENTION_DAYS=${LEDGER_RETENTION_DAYS:-60}
      - IMPRINT_URL=${IMPRINT_URL:-}
      - SOURCE_URL=${SOURCE_URL:-https://github.com/54GradSoftware/fediverse-wrapped}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - FEDIFY_LOG_LEVEL=${FEDIFY_LOG_LEVEL:-warning}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      # NAMED volume and directory only: SQLite WAL needs real POSIX locks, which
      # network or FUSE mounts lack, corrupting the database. Never delete it.
      - wrapped-data:/data

volumes:
  wrapped-data:
